name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # No dtolnay/rust-toolchain step on purpose: rustup honors rust-toolchain.toml
      # (channel + clippy/rustfmt components), so the workflow can't drift from the pin.
      # First cargo/clippy/fmt invocation below installs the pinned toolchain.
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Release artifacts honor the glibc floor
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang==0.16.0 cargo-zigbuild==0.23.4
          PATH="$RUNNER_TEMP/zig/bin:$PATH" cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.28
          R=target/x86_64-unknown-linux-gnu/release
          tests/glibc_floor.sh 2.28 "$R/libtrashd_preload.so" "$R/trashd-exec" "$R/trash" "$R/trashd-rm" "$R/trashd"
      - name: Test
        run: TRASH_BYPASS=1 cargo test --workspace -- --test-threads=1
      - name: CLI and shim integration in disposable filesystem
        run: sudo env TRASH_BYPASS=1 ./tests/integration.sh target/release
      - name: RPM spec lists exactly what make install stages
        run: python3 tests/rpm_files_check.py
      - name: Installer behavior in disposable filesystem
        run: sudo env TRASH_BYPASS=1 ./tests/install_regression.sh target/release
      - name: Preload policy and raw filename round trips
        run: |
          sudo env TRASH_BYPASS=1 python3 tests/sandbox.py --build-dir target/release -- \
            /usr/bin/python3 /tests/preload_policy.py /opt/trashd/lib/libtrashd_preload.so /opt/trashd/bin/trash
      - name: Seccomp interception under unprivileged Yama restrictions
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=1
          sudo env TRASH_BYPASS=1 REQUIRE_SECCOMP=1 python3 tests/sandbox.py --build-dir target/release -- \
            /usr/bin/python3 /tests/seccomp_regression.py
      - name: Verify completions generated
        run: |
          test -f target/completions/trash.bash
          test -f target/completions/_trash
          test -f target/completions/trash.fish
      - name: Verify man pages generated
        run: |
          test -f target/man/trash.1
          test -f target/man/trash-compress.1
          test -f target/man/trash-du.1
