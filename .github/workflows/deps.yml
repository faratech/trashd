name: Update Dependencies

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: read

concurrency:
  group: deps-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Update dependencies
        run: cargo update

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with updated deps
        if: steps.diff.outputs.changed == 'true'
        run: cargo build --release --locked

      - name: Run tests
        if: steps.diff.outputs.changed == 'true'
        run: TRASH_BYPASS=1 cargo test --workspace --locked -- --test-threads=1

      # The PR is opened with GITHUB_TOKEN, which does not trigger CI on it,
      # so the sandboxed end-to-end suites must run here (#239).
      - name: Sandboxed integration, preload and seccomp suites
        if: steps.diff.outputs.changed == 'true'
        run: |
          sudo env TRASH_BYPASS=1 ./tests/integration.sh target/release
          sudo env TRASH_BYPASS=1 python3 tests/sandbox.py --build-dir target/release -- \
            /usr/bin/python3 /tests/preload_policy.py /opt/trashd/lib/libtrashd_preload.so /opt/trashd/bin/trash
          sudo sysctl -w kernel.yama.ptrace_scope=1
          sudo env TRASH_BYPASS=1 REQUIRE_SECCOMP=1 python3 tests/sandbox.py --build-dir target/release -- \
            /usr/bin/python3 /tests/seccomp_regression.py

      - name: Validate updated lockfile
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock
          test ! -L Cargo.lock
          test "$(git diff --name-only --diff-filter=ACDMRTUXB | sort -u)" = "Cargo.lock"
          cargo metadata --locked --format-version 1 > /dev/null

      - name: Upload validated lockfile
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

  create-pr:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download validated lockfile
        uses: actions/download-artifact@v4
        with:
          name: updated-cargo-lock
          path: ${{ runner.temp }}/updated-cargo-lock

      - name: Install validated lockfile
        shell: bash
        env:
          LOCK_ARTIFACT_DIR: ${{ runner.temp }}/updated-cargo-lock
        run: |
          set -euo pipefail
          lock="${LOCK_ARTIFACT_DIR}/Cargo.lock"
          test "$(find "${LOCK_ARTIFACT_DIR}" -mindepth 1 -maxdepth 1 -printf x | wc -c)" -eq 1
          test -f "${lock}"
          test ! -L "${lock}"
          test "$(stat -c %h "${lock}")" -eq 1
          test -f Cargo.lock
          test ! -L Cargo.lock
          install -m 0644 -- "${lock}" Cargo.lock

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: 'chore: update dependencies'
          title: 'chore: weekly dependency update'
          body: |
            Automated dependency update via `cargo update`.

            The update job built this lockfile and passed the unit tests plus
            the sandboxed integration, preload and seccomp suites. This PR was
            opened with `GITHUB_TOKEN`, so CI does not run on it by itself:
            close and reopen it to run CI before merging.
          branch: deps/weekly-update
          delete-branch: true
