[workspace]
resolver = "2"
members = [
    "crates/trashd-common",
    "crates/trashd-cli",
    "crates/trashd-shim",
    "crates/trashd-preload",
    "crates/trashd-seccomp",
    "crates/trashd-daemon",
]

# Release binaries are installed system-wide and the preload library is
# mapped into every process: strip symbols and link thinly so installed
# size, page-in faults, and relocation cost stay low. Panic stays unwind:
# the preload hooks rely on catch_unwind to never abort a host process.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace.package]
version = "0.1.16"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
repository = "https://github.com/faratech/trashd"
homepage = "https://github.com/faratech/trashd"
description = "A Linux recycle bin that works in scripts, cron, and at the desktop"
keywords = ["trash", "recycle-bin", "rm", "undelete", "linux"]
categories = ["command-line-utilities", "filesystem"]
